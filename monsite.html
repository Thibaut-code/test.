<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon premier site</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #1f2937;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #9ca3af;
            font-size: 18px;
        }

        button {
            margin-top: 25px;
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        #message {
            margin-top: 25px;
            font-size: 20px;
            color: #4ade80;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 Mon premier site</h1>

    <p>
        Ce site fonctionne directement depuis Visual Studio Code.
    </p>

    <button onclick="afficherMessage()">
        Clique ici
    </button>

    <div id="message"></div>

</div>

<script>

function afficherMessage() {

    const message = document.getElementById("message");

    message.innerHTML = "🎉 JavaScript fonctionne !";

}

</script>

</body>
</html>
